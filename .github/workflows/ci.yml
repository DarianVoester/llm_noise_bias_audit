name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Actions are pinned to a commit: a version tag can be moved to other code later.
      # Dependabot (.github/dependabot.yml) updates the hash and the version comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Block removed / high-risk packages
        run: |
          if grep -Eiq '^litellm==' requirements.txt; then
            echo "litellm was removed for supply-chain reasons (see SECURITY.md)"; exit 1
          fi
      - name: Install (hash-verified)
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --disable-pip --require-hashes

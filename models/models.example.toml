# =============================================================================
# models.example.toml - template for YOUR OWN models ("Bring Your Own Model")
# =============================================================================
# 1. Copy this file:      cp models/models.example.toml models/models.toml
# 2. Edit / uncomment the entries you need.
# 3. In the app: Models tab -> "Reload registry".
#
# models/models.toml is git-ignored, so your private endpoints stay private.
# NEVER put API keys here - use `api_key_env` with the NAME of an environment
# variable or GitHub Codespaces Secret instead. Give every server a variable of its
# own: OPENAI_API_KEY, ANTHROPIC_API_KEY, GITHUB_TOKEN and similar are refused here,
# so that a key never goes to a server it was not made for.
#
# Full guide: docs/BRING_YOUR_OWN_MODEL.md
# =============================================================================

# --- Example 1: LM Studio (runs on your machine; use a local Dev Container) ---
# [[model]]
# id           = "lmstudio-qwen"
# display_name = "Qwen in LM Studio"
# provider     = "openai_compatible"
# model        = "qwen2.5-7b-instruct"          # exact name shown by LM Studio
# api_base     = "http://host.docker.internal:1234/v1"
# supports_json_mode = true

# --- Example 2: llama.cpp `llama-server` inside the Codespace -----------------
# [[model]]
# id           = "llamacpp-myfinetune"
# display_name = "My fine-tune (llama.cpp, Q4_K_M)"
# provider     = "openai_compatible"
# model        = "my-finetune"                  # llama-server accepts any name
# api_base     = "http://127.0.0.1:8080/v1"
# supports_seed      = true
# supports_json_mode = false                    # prompt-only JSON + robust parser
# max_concurrency    = 1                        # CPU: one request at a time
# timeout_s          = 300
# license      = "Llama 3.2 Community License"
# notes        = "Fine-tuned on internal support tickets"

# --- Example 3: vLLM on a GPU box in your private network --------------------
# [[model]]
# id           = "vllm-llama8b"
# provider     = "openai_compatible"
# model        = "meta-llama/Llama-3.1-8B-Instruct"
# api_base     = "http://192.168.1.50:8000/v1"
# api_key_env  = "VLLM_API_KEY"                 # NAME of the env var, not the key
# supports_json_mode = true
# supports_logprobs  = true
# max_concurrency    = 8

# --- Example 4: an Ollama model under a custom name / different host ---------
# [[model]]
# id           = "ollama-mymodel"
# provider     = "ollama"
# model        = "my-imported-model:latest"     # created with scripts/import_gguf.sh
# api_base     = "http://127.0.0.1:11434"

# --- Example 5: model that rejects the "system" role --------------------------
# [[model]]
# id           = "no-system-role"
# provider     = "openai_compatible"
# model        = "some-model"
# api_base     = "http://127.0.0.1:8080/v1"
# system_prompt_supported = false               # system prompt is merged into the user turn
# [model.default_params]                        # extra params passed to every request
# top_p = 0.95

# Public endpoints (prompts leave your machine!) need an explicit opt-in. With an
# `api_key_env`, the address of a public endpoint must start with https://
# allow_public_endpoint = true

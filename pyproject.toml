[project]
name = "llm-noise-bias-audit"
version = "0.1.0"
description = "Measure noise and bias of LLM judgments across isolated context windows (inspired by Kahneman, Sibony & Sunstein's 'Noise')."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert in tests
    "S603",  # subprocess without shell (we always use argument lists)
    "S607",  # partial executable path ("ollama")
    "S311",  # `random` is used for reproducible experimental designs, never for crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"src/presets.py" = ["E501"]
"src/cases.py" = ["E501"]
"src/sandbox_child.py" = ["S102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not ollama'"
markers = [
    "ollama: integration tests requiring a running local Ollama server",
]
